<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f5">
  <title>Website link needed · Ad Creative Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell narrow">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Ad Creative Agent home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-name">Ad Creative Agent</span>
      </a>
    </header>
    <p class="eyebrow">PRODUCT LINK</p>
    <h1>No product URL provided.</h1>
    <div class="panel destination-panel">
      <h2>Add a product URL</h2>
      <p class="hint">Include its public URL when creating an ad pack to enable this link.</p>
    </div>
    <a class="button secondary" href="/l/{{ variant_id }}">← Back to the ad preview</a>
    <a class="button" href="/">Create another ad pack <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
